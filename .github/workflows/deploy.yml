# Builds the static site and publishes it to GitHub Pages (free hosting).
# Setup once: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
#   push to main ──▶ check (build + HTML validation + broken-link check) ──▶ deploy (build with build info → Pages)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is allowed to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gives the URL and base path of this Pages site, e.g. https://<user>.github.io/<repo> and /<repo>
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build static site (out/)
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Validate HTML
        run: npm run check:html

      - name: Check internal links
        run: npm run check:links

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      # Shown in the site footer: "deployed via GitHub Actions · build abc1234 · updated 2026-10-26"
      - name: Write build info
        run: echo "{\"sha\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +%Y-%m-%d)\"}" > public/build-info.json

      - name: Build static site (out/)
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true # keeps out/.nojekyll

      - id: deployment
        uses: actions/deploy-pages@v5
